name: Android build

# Builds the phone app for Android here, without EAS: `expo prebuild` makes the native project from app.config.ts
# (it is never committed), Gradle builds it and signs it with the upload key, and the result is kept as the run's
# artifact (and, for production with the Play secret set, sent to the Play Store's internal track as a draft).
# Runs only by hand (Actions → Run workflow). See apps/mobile/README.md, "Android on GitHub Actions".
#
# Secrets (repository settings, never in the repo):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD: the upload key
#   GOOGLE_SERVICES_JSON_BASE64: optional, Firebase's google-services.json (push on Android)
#   PLAY_SERVICE_ACCOUNT_JSON: optional, a Google Play service account allowed to release
# Variable (optional): ANDROID_VERSION_CODE_BASE, added to the run number (above the last version code on Play).
# A secret still set to PLACEHOLDER (made so the names exist) counts as not set.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "App variant"
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

# A preview and a production build of the same branch don't cancel each other.
concurrency:
  group: android-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    # Gradle and the native code want 32 GB (CI_RUNNER_XLARGE names a runner that has them). The job expects the
    # Android SDK on the runner's image, as on GitHub's ubuntu-24.04.
    runs-on: ${{ vars.CI_RUNNER_XLARGE || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      APP_VARIANT: ${{ inputs.variant }}
    steps:
      # Fails in seconds, before anything is installed, when the key isn't there.
      - name: Upload key is set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            value=$(printenv "$name" || true)
            if [ -z "$value" ] || [ "$value" = PLACEHOLDER ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then echo "See apps/mobile/README.md, \"Android on GitHub Actions\"."; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Expo SDK 58 needs Node 22.13 or later; eas.json builds on 24.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # React Native 0.88's Android build (AGP 9, Gradle 9) runs on JDK 17.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - run: bun install --frozen-lockfile
      - name: Version code
        env:
          BASE: ${{ vars.ANDROID_VERSION_CODE_BASE }}
        run: echo "ANDROID_VERSION_CODE=$(( ${BASE:-0} + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"
      # The key and Firebase's file go to the runner's temp folder, outside the checkout, and are deleted at the end.
      - name: Signing key and Firebase config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          package=chat.agentes.app
          if [ "$APP_VARIANT" != production ]; then package="$package.$APP_VARIANT"; fi
          if [ -z "$GOOGLE_SERVICES_BASE64" ] || [ "$GOOGLE_SERVICES_BASE64" = PLACEHOLDER ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set: this build gets no push on Android."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 -d > "$RUNNER_TEMP/google-services.json"
          # Gradle refuses a google-services.json without the app's package, so a file made for another
          # variant is left out instead of failing the build.
          if jq -e --arg p "$package" 'any(.client[]?; .client_info.android_client_info.package_name == $p)' \
            "$RUNNER_TEMP/google-services.json" > /dev/null; then
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          else
            echo "::warning::google-services.json has no app $package in Firebase: this build gets no push on Android."
          fi
      - name: Native project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --clean --no-install
      # Production: an app bundle for the Play Store, every architecture. Preview: an APK to install directly, arm64
      # only (every current phone), which halves the native compile. More heap than the template's 2 GB for R8.
      - name: Build
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$APP_VARIANT" = production ]; then
            ./gradlew --no-daemon "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" bundleRelease
          else
            ./gradlew --no-daemon "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" \
              -PreactNativeArchitectures=arm64-v8a assembleRelease
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ inputs.variant }}-${{ env.ANDROID_VERSION_CODE }}
          path: |
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
            apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          # APKs and bundles are already compressed.
          compression-level: 0
      # Google Play only takes uploads through the API once the app's first bundle was uploaded by hand.
      - name: Play Store (internal track)
        if: inputs.variant == 'production'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ] || [ "$PLAY_JSON" = PLACEHOLDER ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set: the bundle stays in the run's artifact."
          else
            echo "HAS_PLAY=true" >> "$GITHUB_ENV"
          fi
      - if: inputs.variant == 'production' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: chat.agentes.app
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
      - name: Remove the key and Firebase's file
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" "$RUNNER_TEMP/google-services.json"
